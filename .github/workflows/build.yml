name: build

permissions:
  contents: write

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build .NET 9.0 (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build (net9.0)
        run: dotnet build src/VerifactuDll.csproj -c Release -f net9.0

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: verifactu-net9
          path: src/bin/Release/net9.0
          if-no-files-found: error

  build-net48-windows:
    name: Build .NET 4.8 (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      
      - name: Build (net48)
        run: dotnet build src/VerifactuDll.csproj -c Release -f net48
      
      - name: COM Registration Test
        shell: pwsh
        run: |
          $regasm = "$env:SystemRoot\Microsoft.NET\Framework\v4.0.30319\RegAsm.exe"
          & $regasm ".\bin\Release\net48\VerifactuDll.dll" /tlb /codebase
          Write-Host "Registrado OK"  

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: verifactu-net48
          path: bin/Release/net48

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-linux, build-net48-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download net9 artifact
        uses: actions/download-artifact@v4
        with:
          name: verifactu-net9
          path: artifact/net9

      - name: Download net48 artifact
        uses: actions/download-artifact@v4
        with:
          name: verifactu-net48
          path: artifact/net48

      - name: List artifact
        run: find artifact -type f -maxdepth 4

      - name: Zip
        run: |
          mkdir dist
          zip -r dist/verifactu-dll-${{ github.run_number }}.zip artifact
      
      - name: Create release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: build-${{ github.run_number }}
          release_name: build-${{ github.run_number }}
          draft: false
          prerelease: false
      
      - name: Upload asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/verifactu-dll-${{ github.run_number }}.zip
          asset_name: verifactu-dll-${{ github.run_number }}.zip
          asset_content_type: application/zip
